<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — DeryCare Shop</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page-head" style="padding:26px 0">
  <div class="wrap small"><a href="shop.html">Shop</a> › <span id="crumb">Product</span></div>
</div>
<section style="padding-top:10px">
  <div class="wrap" id="pdBox"></div>
</section>
<section class="section-alt">
  <div class="wrap center">
    <h3>Need help with this product?</h3>
    <p class="lead center" style="margin:8px auto 0">Chat with DeryCare on WhatsApp — we answer fast.</p>
    <div class="mt16"><button class="btn btn-wa" onclick="waMsg('Hello DeryCare! I have a question about a product.')">💬 Chat with DeryCare</button></div>
  </div>
</section>
<footer><div class="wrap"><div class="f-powered">
  <span>© 2026 DeryCare. All rights reserved.</span>
  <span style="display:flex;align-items:center;gap:10px">Powered by <span class="derycode-logo" aria-label="Derycode"><span class="dc-mark">D</span><span class="dc-word">Derycode</span></span> technology</span>
</div></div></footer>
<script src="assets/app.js"></script>
<script>
  chrome("shop.html");
  const pid = new URLSearchParams(location.search).get("id") || "msc";
  pdProduct = getP(pid) || PRODUCTS[0];
  document.title = pdProduct.name + " — DeryCare Shop";
  $("crumb").textContent = pdProduct.name;
  renderProduct();
</script>
</body>
</html>
